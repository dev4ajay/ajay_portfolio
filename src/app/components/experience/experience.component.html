<section
  id="experience"
  class="relative min-h-screen py-24 px-6 overflow-hidden
         bg-slate-50 dark:bg-gray-800
         transition-colors duration-500"
>

  <!-- ── Ambient Orbs ── -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-28 w-96 h-96 rounded-full
                bg-violet-400 opacity-10 dark:opacity-20
                blur-[110px] animate-orb-1"></div>
    <div class="absolute top-1/2 -right-24 w-80 h-80 rounded-full
                bg-pink-400 opacity-8 dark:opacity-15
                blur-[100px] animate-orb-2"></div>
    <div class="absolute -bottom-28 left-1/3 w-72 h-72 rounded-full
                bg-teal-400 opacity-8 dark:opacity-12
                blur-[90px] animate-orb-3"></div>
  </div>

  <!-- ── Dot Grid ── -->
  <div class="pointer-events-none absolute inset-0
              opacity-[0.025] dark:opacity-[0.05]
              [background-image:radial-gradient(circle,#6C63FF_1px,transparent_1px)]
              [background-size:30px_30px]">
  </div>

  <!-- ── Content ── -->
  <div class="relative z-10 max-w-4xl mx-auto">

    <!-- ── Heading ── -->
    <div class="text-center mb-16 animate-fade-up">

      <span class="inline-block mb-4 px-5 py-1.5 rounded-full text-xs font-bold
                   uppercase tracking-widest
                   bg-violet-100 text-violet-700 border border-violet-200
                   dark:bg-violet-500/10 dark:text-violet-300 dark:border-violet-500/30
                   transition-colors duration-500">
        ✦ My Journey
      </span>

      <h2 class="text-4xl md:text-5xl font-black
                 bg-gradient-to-r from-violet-600 via-pink-500 to-teal-500
                 dark:from-violet-400 dark:via-pink-400 dark:to-teal-300
                 bg-clip-text text-transparent animate-gradient-x leading-tight">
        Experience
      </h2>

      <p class="mt-3 text-sm text-slate-500 dark:text-slate-400
                max-w-md mx-auto transition-colors duration-500">
        Years of building real-world products and growing as a developer 💻
      </p>

      <div class="mt-4 mx-auto w-24 h-1 rounded-full
                  bg-gradient-to-r from-violet-500 via-pink-500 to-teal-400
                  animate-gradient-x">
      </div>
    </div>

    <!-- ── Timeline ── -->
    <div class="relative">

      <!-- Vertical line -->
      <div class="absolute left-6 md:left-1/2 md:-translate-x-px top-0 bottom-0
                  w-px
                  bg-gradient-to-b from-violet-500/60 via-pink-500/40 to-teal-400/30
                  dark:from-violet-400/50 dark:via-pink-400/30 dark:to-teal-400/20">
      </div>

      <!-- ── Timeline Items ── -->
      <div class="space-y-12">

        <ng-container *ngFor="let item of experiences; let i = index">

          <!-- Each row alternates left/right on md+ -->
          <div
            class="relative flex items-start gap-6 md:gap-0 animate-fade-up-stagger"
            [style.animation-delay]="i * 150 + 'ms'"
            [ngClass]="i % 2 === 0
              ? 'md:flex-row'
              : 'md:flex-row-reverse'"
          >

            <!-- ── Dot (center on md+) ── -->
            <div class="absolute left-6 md:left-1/2 md:-translate-x-1/2
                        top-6 z-20 flex items-center justify-center">
              <div class="w-4 h-4 rounded-full border-2 border-white dark:border-[#07070f]
                          shadow-lg transition-all duration-300
                          group-hover:scale-125"
                   [ngStyle]="{'background': item.gradient}">
              </div>
              <!-- Pulse ring -->
              <div class="absolute w-8 h-8 rounded-full opacity-30 animate-ping-slow"
                   [ngStyle]="{'background': item.color + '33'}">
              </div>
            </div>

            <!-- ── Spacer (md only) ── -->
            <div class="hidden md:block md:w-1/2"></div>

            <!-- ── Card ── -->
            <div
              class="ml-14 md:ml-0 md:w-1/2 group
                     relative rounded-3xl overflow-hidden
                     bg-white border border-slate-200/80
                     dark:bg-white/[0.03] dark:border-white/[0.08]
                     shadow-lg shadow-slate-100 dark:shadow-black/30
                     hover:shadow-2xl hover:shadow-violet-200/40
                     dark:hover:shadow-violet-900/30
                     hover:-translate-y-1
                     hover:border-violet-300/60 dark:hover:border-violet-500/30
                     transition-all duration-500 ease-out
                     backdrop-blur-sm"
              [ngClass]="i % 2 === 0 ? 'md:ml-8' : 'md:mr-8'"
            >

              <!-- Top gradient bar -->
              <div class="h-1 w-full group-hover:h-1.5 transition-all duration-500"
                   [ngStyle]="{'background': item.gradient}">
              </div>

              <!-- Hover glow -->
              <div class="absolute inset-0 opacity-0 group-hover:opacity-100
                          transition-opacity duration-500 pointer-events-none rounded-3xl"
                   [ngStyle]="{'background': item.glowBg}">
              </div>

              <div class="relative z-10 p-6">

                <!-- Header row -->
                <div class="flex items-start justify-between mb-3 gap-3">

                  <div class="flex items-center gap-3">
                    <!-- Icon box -->
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center
                                text-xl shrink-0 border border-slate-100
                                dark:border-white/10 shadow-sm
                                group-hover:scale-110 group-hover:rotate-3
                                transition-transform duration-400"
                         [ngStyle]="{'background': item.iconBg}">
                      {{ item.icon }}
                    </div>
                    <div>
                      <h3 class="text-base font-black text-slate-800 dark:text-white
                                 group-hover:text-violet-700 dark:group-hover:text-violet-300
                                 transition-colors duration-300 leading-tight">
                        {{ item.role }}
                      </h3>
                      <p class="text-xs font-semibold mt-0.5
                                bg-gradient-to-r bg-clip-text text-transparent"
                         [ngStyle]="{'background': item.gradient, '-webkit-background-clip': 'text',
                                     '-webkit-text-fill-color': 'transparent'}">
                        {{ item.company }}
                      </p>
                    </div>
                  </div>

                  <!-- Date badge -->
                  <span class="shrink-0 px-3 py-1 rounded-full text-xs font-semibold
                               bg-slate-100 text-slate-500 border border-slate-200
                               dark:bg-white/5 dark:text-slate-400 dark:border-white/10
                               transition-colors duration-500">
                    {{ item.period }}
                  </span>
                </div>

                <!-- Description -->
                <p class="text-sm text-slate-500 dark:text-slate-400
                          leading-relaxed transition-colors duration-500 mb-3">
                  {{ item.description }}
                </p>

                <!-- Bullet points -->
                <ul class="space-y-1.5 mb-4">
                  <li *ngFor="let point of item.points"
                      class="flex items-start gap-2 text-xs text-slate-500 dark:text-slate-400
                             transition-colors duration-500">
                    <span class="mt-1 w-1.5 h-1.5 rounded-full shrink-0"
                          [ngStyle]="{'background': item.color}">
                    </span>
                    {{ point }}
                  </li>
                </ul>

                <!-- Divider -->
                <div class="h-px bg-slate-100 dark:bg-white/5
                            group-hover:bg-violet-100 dark:group-hover:bg-violet-500/10
                            transition-colors duration-500 mb-4">
                </div>

                <!-- Tech badges -->
                <div class="flex flex-wrap gap-2">
                  <span *ngFor="let tag of item.tags"
                        class="px-3 py-1 rounded-full text-xs font-semibold
                               bg-slate-100 text-slate-500 border border-slate-200
                               dark:bg-white/5 dark:text-slate-400 dark:border-white/10
                               group-hover:border-violet-200 group-hover:text-violet-600
                               dark:group-hover:border-violet-500/30 dark:group-hover:text-violet-300
                               transition-all duration-300">
                    {{ tag }}
                  </span>
                </div>

              </div>
            </div>

          </div>
        </ng-container>

      </div>
      <!-- end timeline items -->

    </div>
    <!-- end timeline -->

  </div>
</section>
