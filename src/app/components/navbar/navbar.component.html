<nav
  class="fixed w-full top-0 z-50 transition-all duration-500 backdrop-blur-xl"
  [ngClass]="scrolled
    ? 'bg-white/90 dark:bg-[#0a0a14]/90 shadow-lg shadow-violet-100/20 dark:shadow-black/40 border-b border-slate-200 dark:border-white/10'
    : 'bg-white/0 dark:bg-transparent border-b border-transparent'"
>
  <div class="flex justify-between items-center max-w-7xl mx-auto px-6 h-16">

    <!-- ── Logo ── -->
    <a href="#" class="flex items-center gap-2.5 group">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center text-white
                  font-black text-sm shadow-md shadow-violet-500/30
                  bg-gradient-to-br from-violet-600 to-pink-500
                  group-hover:scale-110 group-hover:rotate-3
                  transition-transform duration-300">
        A
      </div>
      <span class="font-black text-lg tracking-tight bg-clip-text text-transparent
                   bg-gradient-to-r from-violet-600 via-pink-500 to-teal-500
                   dark:from-violet-400 dark:via-pink-400 dark:to-teal-300
                   animate-gradient-x">
        Ajay Pabriya
      </span>
    </a>

    <!-- ── Desktop Links ── -->
    <div class="hidden md:flex items-center gap-1">
      <a *ngFor="let link of navLinks"
         [href]="link.href"
         class="relative px-4 py-2 rounded-xl text-sm font-semibold
                text-slate-600 dark:text-slate-300
                hover:text-violet-600 dark:hover:text-violet-400
                hover:bg-violet-50 dark:hover:bg-violet-500/10
                transition-all duration-300 group">
        {{ link.label }}
        <span class="absolute bottom-1 left-1/2 -translate-x-1/2 h-0.5 w-0
                     group-hover:w-4/5 rounded-full
                     bg-gradient-to-r from-violet-500 to-pink-500
                     transition-all duration-300">
        </span>
      </a>
    </div>

    <!-- ── Right Side ── -->
    <div class="hidden md:flex items-center gap-3">

      <!-- Hire Me -->
      <button class="px-5 py-2 rounded-xl text-sm font-bold text-white
                     shadow-lg shadow-violet-500/25
                     bg-gradient-to-r from-violet-600 via-pink-500 to-teal-500
                     animate-gradient-x
                     hover:-translate-y-0.5 hover:shadow-violet-500/40
                     active:scale-[.97] transition-all duration-300">
        Hire Me ✨
      </button>

      <!-- Theme Toggle -->
      <button
        (click)="toggleTheme()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
        class="relative w-14 h-7 rounded-full border cursor-pointer
               transition-all duration-500
               bg-slate-100 border-slate-300
               dark:bg-white/10 dark:border-white/20
               hover:border-violet-400 dark:hover:border-violet-400
               hover:shadow-md hover:shadow-violet-200/50 dark:hover:shadow-violet-900/40">

        <!-- Track gradient (visible in dark) -->
        <span class="absolute inset-0.5 rounded-full transition-all duration-500
                     bg-gradient-to-r from-violet-500 to-pink-500
                     opacity-0 dark:opacity-100">
        </span>

        <!-- Knob -->
        <span class="absolute top-0.5 left-0.5 w-6 h-6 rounded-full z-10
                     flex items-center justify-center text-xs
                     bg-white shadow-md shadow-black/20
                     transition-all duration-500
                     translate-x-0 dark:translate-x-7">
          <!-- Moon = light mode -->
          <span class="absolute transition-all duration-300
                       opacity-100 dark:opacity-0 scale-100 dark:scale-0">🌙</span>
          <!-- Sun = dark mode -->
          <span class="absolute transition-all duration-300
                       opacity-0 dark:opacity-100 scale-0 dark:scale-100">☀️</span>
        </span>
      </button>

    </div>

    <!-- ── Mobile Hamburger ── -->
    <button
      (click)="toggleMenu()"
      class="md:hidden relative w-9 h-9 flex flex-col items-center justify-center gap-1.5
             rounded-xl border transition-all duration-300
             bg-white dark:bg-white/5
             border-slate-200 dark:border-white/10
             hover:border-violet-400 dark:hover:border-violet-500/50">

      <span class="block w-5 h-0.5 rounded-full transition-all duration-300
                   bg-slate-600 dark:bg-slate-300"
            [ngClass]="menuOpen ? 'rotate-45 translate-y-2' : ''"></span>
      <span class="block w-5 h-0.5 rounded-full transition-all duration-300
                   bg-slate-600 dark:bg-slate-300"
            [ngClass]="menuOpen ? 'opacity-0 scale-x-0' : ''"></span>
      <span class="block w-5 h-0.5 rounded-full transition-all duration-300
                   bg-slate-600 dark:bg-slate-300"
            [ngClass]="menuOpen ? '-rotate-45 -translate-y-2' : ''"></span>
    </button>

  </div>

  <!-- ── Mobile Menu ── -->
  <div
    *ngIf="menuOpen"
    class="md:hidden overflow-hidden animate-slide-down backdrop-blur-xl
           border-t border-slate-200 dark:border-white/10
           bg-white/95 dark:bg-[#0a0a14]/95">

    <div class="px-5 py-4 flex flex-col gap-1">

      <a *ngFor="let link of navLinks"
         [href]="link.href"
         (click)="toggleMenu()"
         class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold
                text-slate-600 dark:text-slate-300
                hover:text-violet-600 dark:hover:text-violet-400
                hover:bg-violet-50 dark:hover:bg-violet-500/10
                border border-transparent
                hover:border-violet-200 dark:hover:border-violet-500/20
                transition-all duration-300">
        <span class="text-base">{{ link.icon }}</span>
        {{ link.label }}
        <span class="ml-auto text-xs
                     text-slate-400 dark:text-slate-500">→</span>
      </a>

      <!-- Mobile bottom row -->
      <div class="flex items-center gap-3 mt-3 pt-3
                  border-t border-slate-100 dark:border-white/10">

        <button class="flex-1 py-2.5 rounded-xl text-sm font-bold text-white
                       bg-gradient-to-r from-violet-600 to-pink-500
                       hover:opacity-90 active:scale-[.97] transition-all duration-300">
          Hire Me ✨
        </button>

        <button
          (click)="toggleTheme()"
          class="w-11 h-11 rounded-xl flex items-center justify-center text-lg
                 border transition-all duration-300
                 bg-slate-50 dark:bg-white/5
                 border-slate-200 dark:border-white/10
                 hover:border-violet-400 dark:hover:border-violet-500/50">
          {{ theme.isDark() ? '☀️' : '🌙' }}
        </button>

      </div>
    </div>
  </div>

</nav>

<!-- Spacer -->
<div class="h-16 bg-white dark:bg-[#0a0a14] transition-colors duration-500"></div>
