<section
  class="relative min-h-screen flex flex-col items-center justify-center
         overflow-hidden px-6 pb-16 pt-20 text-center
         bg-gray-50 dark:bg-gray-800
         transition-colors duration-500">

  <!-- Grid background -->
  <div class="absolute inset-0 pointer-events-none
              [background-image:linear-gradient(rgba(167,139,250,0.06)_1px,transparent_1px),linear-gradient(90deg,rgba(167,139,250,0.06)_1px,transparent_1px)]
              [background-size:40px_40px]
              [mask-image:radial-gradient(ellipse_80%_80%_at_50%_50%,black_30%,transparent_100%)]
              opacity-0 dark:opacity-100 transition-opacity duration-500">
  </div>

  <!-- Orbs (dark only) -->
  <div class="absolute -top-24 -left-20 w-96 h-96 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(124,58,237,0.22),transparent_70%)]
              opacity-0 dark:opacity-100 animate-orb1 transition-opacity duration-500">
  </div>
  <div class="absolute -bottom-16 -right-10 w-72 h-72 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(219,39,119,0.16),transparent_70%)]
              opacity-0 dark:opacity-100 animate-orb2 transition-opacity duration-500">
  </div>
  <div class="absolute top-[40%] left-[10%] w-48 h-48 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(96,165,250,0.12),transparent_70%)]
              opacity-0 dark:opacity-100 animate-orb3 transition-opacity duration-500">
  </div>

  <!-- Light mode decorative blobs -->
  <div class="absolute -top-24 -left-20 w-96 h-96 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(124,58,237,0.08),transparent_70%)]
              dark:opacity-0 opacity-100 animate-orb1 transition-opacity duration-500">
  </div>
  <div class="absolute -bottom-16 -right-10 w-72 h-72 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(219,39,119,0.06),transparent_70%)]
              dark:opacity-0 opacity-100 animate-orb2 transition-opacity duration-500">
  </div>

  <!-- Content -->
  <div class="relative z-10 max-w-2xl w-full">

    <!-- Badge -->
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full mb-6
                border animate-fade-up
                bg-violet-50 border-violet-200 text-violet-600
                dark:bg-violet-500/10 dark:border-violet-500/25 dark:text-violet-400
                transition-colors duration-500 text-[12.5px] font-medium">
      <span class="w-2 h-2 rounded-full bg-emerald-400
                   shadow-[0_0_0_3px_rgba(74,222,128,0.2)]
                   animate-pulse">
      </span>
      Available for freelance work
    </div>

    <!-- Greeting -->
    <p class="text-[15px] font-medium mb-2 tracking-wide
              text-slate-400 dark:text-white/35
              animate-fade-up [animation-delay:100ms]
              transition-colors duration-500">
      Hello, World!
    </p>

    <!-- Name -->
    <h1 class="font-extrabold leading-[1.1] tracking-tight mb-4
               text-slate-800 dark:text-white
               text-4xl sm:text-5xl lg:text-[58px]
               animate-fade-up [animation-delay:200ms]
               transition-colors duration-500">
      Hi, I'm
      <span class="bg-gradient-to-br from-violet-500 via-pink-500 to-blue-400
                   dark:from-violet-400 dark:via-pink-400 dark:to-blue-300
                   bg-clip-text text-transparent
                   [background-size:200%_200%] animate-shimmer">
        Ajay Kumar
      </span>
    </h1>

    <!-- Typewriter -->
    <div class="flex items-center justify-center gap-1 mb-3 min-h-[30px]
                text-lg font-medium
                text-slate-500 dark:text-white/50
                animate-fade-up [animation-delay:300ms]
                transition-colors duration-500">
      <span>{{ typedText }}</span>
      <span class="inline-block w-0.5 h-5 rounded-sm bg-violet-500
                   dark:bg-violet-400 animate-blink">
      </span>
    </div>

    <!-- Sub -->
    <p class="text-[15px] leading-relaxed max-w-md mx-auto mb-7
              text-slate-500 dark:text-white/32
              animate-fade-up [animation-delay:400ms]
              transition-colors duration-500">
      I craft modern, scalable & high-performance web applications
      with clean code and pixel-perfect design.
    </p>

    <!-- Tech Pills -->
    <div class="flex flex-wrap justify-center gap-2 mb-6
                animate-fade-up [animation-delay:450ms]">
      <span *ngFor="let t of techs"
            class="px-3 py-1 rounded-full text-[11.5px] font-medium
                   border cursor-default transition-all duration-250
                   text-slate-500 border-slate-200 bg-slate-50
                   hover:text-violet-600 hover:border-violet-300 hover:bg-violet-50
                dark:bg-gray-900 dark:text-violet-500">
        {{ t }}
      </span>
    </div>

    <!-- Buttons -->
    <div class="flex flex-wrap justify-center gap-3 mb-10
                animate-fade-up [animation-delay:500ms]">
      <button class="px-7 py-3 rounded-2xl text-sm font-semibold text-gray-50
                     bg-gradient-to-br from-violet-600 to-pink-600
                     hover:-translate-y-0.5
                     hover:shadow-xl hover:shadow-violet-500/30
                     active:scale-[.97] transition-all duration-250">
        Hire Me ✨
      </button>
      <button class="px-7 py-3 rounded-2xl text-sm font-medium
                     border transition-all duration-250
                     text-slate-600 border-slate-200 bg-gray-50
                     hover:border-violet-300 hover:text-violet-600 hover:bg-violet-50
                     hover:-translate-y-0.5
                     dark:text-white/70 dark:border-white/10 dark:bg-white/5
                     dark:hover:bg-white/10 dark:hover:text-white dark:hover:border-violet-500/40
                     active:scale-[.97]">
        View Projects →
      </button>
    </div>

    <!-- Stats -->
    <div class="flex rounded-2xl overflow-hidden
                bg-gray-50
                dark:border-white/7 dark:bg-gray-900 dark:text-violet-500
                animate-fade-up [animation-delay:650ms]
                transition-colors duration-500">
      <div *ngFor="let s of stats; let last = last"
           class="flex-1 px-5 py-4 text-center transition-colors duration-250
                   dark:bg-gray-900 dark:text-violet-500
                  hover:bg-violet-50 dark:hover:bg-violet-500/6"
           [class.border-r-0]="last">
        <span class="block text-[22px] font-bold mb-1
                     bg-gradient-to-br from-violet-500 to-pink-500
                     bg-clip-text text-transparent">
          {{ s.value }}{{ s.suffix }}
        </span>
        <span class="text-[11px] font-medium tracking-wide
                     text-slate-400 dark:text-violet-500
                     transition-colors duration-500">
          {{ s.label }}
        </span>
      </div>
    </div>

  </div>

  <!-- Scroll hint -->
  <div class="absolute bottom-6 left-1/2 -translate-x-1/2
              flex flex-col items-center gap-1.5
              animate-fade-up [animation-delay:1000ms]">
    <span class="text-[10px] font-medium tracking-[1.5px]
                 text-slate-300 dark:text-white/20
                 transition-colors duration-500">
      SCROLL
    </span>
    <div class="w-px h-9 bg-gradient-to-b from-violet-400 to-transparent
                dark:from-violet-500/60 animate-scroll-line">
    </div>
  </div>

</section>
