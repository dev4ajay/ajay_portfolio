<section id="skills"
  class="relative overflow-hidden px-8 py-24
         bg-gray-50 dark:bg-gray-800
         transition-colors duration-500">

  <!-- Orbs -->
  <div class="absolute -top-24 -left-20 w-96 h-96 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(124,58,237,0.07),transparent_70%)]
              dark:bg-[radial-gradient(circle,rgba(124,58,237,0.15),transparent_70%)]">
  </div>
  <div class="absolute -bottom-16 -right-10 w-72 h-72 rounded-full pointer-events-none
              bg-[radial-gradient(circle,rgba(219,39,119,0.05),transparent_70%)]
              dark:bg-[radial-gradient(circle,rgba(219,39,119,0.12),transparent_70%)]">
  </div>

  <div class="relative z-10 max-w-5xl mx-auto">

    <!-- ── Header ── -->
    <div class="text-center mb-12">

      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full mb-4
                  text-[11.5px] font-semibold uppercase tracking-widest
                  bg-violet-50 border border-violet-200 text-violet-600
                  dark:bg-violet-500/8 dark:border-violet-500/20 dark:text-violet-400
                  transition-colors duration-500">
        <span class="w-1.5 h-1.5 rounded-full bg-violet-500 dark:bg-violet-400"></span>
        My Skills
      </div>

      <h2 class="font-extrabold tracking-tight mb-3
                 text-slate-800 dark:text-white
                 text-3xl md:text-[40px]
                 transition-colors duration-500">
        What I
        <span class="bg-gradient-to-br from-violet-500 to-pink-500
                     dark:from-violet-400 dark:to-pink-400
                     bg-clip-text text-transparent
                     [background-size:200%] animate-shimmer">
          Work With
        </span>
      </h2>

      <p class="text-sm max-w-md mx-auto
                text-slate-400 dark:text-white/32
                transition-colors duration-500">
        Technologies and tools I use to bring ideas to life
      </p>
    </div>

    <!-- ── Tabs ── -->
    <div class="flex flex-wrap justify-center gap-2 mb-9">
      <button *ngFor="let tab of tabs"
              (click)="setTab(tab.key)"
              class="px-5 py-2 rounded-full text-[13px] font-medium
                     border transition-all duration-250 cursor-pointer"
              [ngClass]="activeTab === tab.key
                ? 'bg-gradient-to-r from-violet-600 to-pink-600 text-white border-transparent shadow-lg shadow-violet-500/30'
                : 'text-slate-500 border-slate-200 bg-gray-50 hover:text-violet-600 hover:border-violet-300 hover:bg-violet-50 dark:text-white/40 dark:border-white/8 dark:bg-transparent dark:hover:text-violet-400 dark:hover:border-violet-500/30 dark:hover:bg-violet-500/6'">
        {{ tab.label }}
      </button>
    </div>
<!-- ── Skills Grid ── -->
<div class="grid gap-3.5"
     style="grid-template-columns: repeat(auto-fill, minmax(148px, 1fr))">

  <div *ngFor="let s of filteredSkills; let i = index"
       class="relative overflow-hidden rounded-[18px] p-5 text-center
              cursor-default group animate-fade-up
              transition-all duration-300
              bg-gray-50 border border-slate-200
              shadow-sm shadow-slate-100
              hover:-translate-y-2 hover:scale-[1.04]
              hover:shadow-xl hover:shadow-slate-200/80
             dark:text-gray-400
            dark:bg-gray-900 dark:border-gray-900
              dark:hover:shadow-none"
       [style.animation-delay]="i * 0.06 + 's'"
       (mouseenter)="el.style.borderColor = s.accent; el.style.boxShadow = '0 20px 40px ' + s.shadow"
       (mouseleave)="el.style.borderColor = ''; el.style.boxShadow = ''"
       #el>

    <!-- Radial glow on hover (dark only) -->
    <div class="absolute inset-0 rounded-[18px] opacity-0 group-hover:opacity-100
                transition-opacity duration-300 pointer-events-none hidden dark:block"
         [ngStyle]="{'background': 'radial-gradient(circle at 50% 0%, ' + s.shadow + ', transparent 70%)'}">
    </div>

    <!-- Light mode top accent line -->
    <div class="absolute top-0 left-0 right-0 h-0.5 rounded-t-[18px]
                opacity-0 group-hover:opacity-100
                transition-opacity duration-300 dark:hidden"
         [ngStyle]="{'background': 'linear-gradient(to right, transparent, ' + s.accent + ', transparent)'}">
    </div>

    <!-- Icon -->
    <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-[26px]
                mx-auto mb-3 relative z-10
                transition-all duration-300
                group-hover:scale-110 group-hover:-rotate-6
                ring-1 ring-slate-100 dark:ring-transparent"
         [ngStyle]="{'background': s.iconBg}">
      {{ s.icon }}
    </div>

    <!-- Name -->
    <div class="text-[13px] font-semibold mb-2 relative z-10
                transition-colors duration-300
                text-slate-600 group-hover:text-slate-900
                dark:text-white/70 dark:group-hover:text-white">
      {{ s.name }}
    </div>

    <!-- Dots -->
    <div class="flex gap-1 justify-center relative z-10">
      <span *ngFor="let d of [1,2,3,4,5]"
            class="w-1.5 h-1.5 rounded-full transition-colors duration-300"
            [ngStyle]="d <= s.level ? {'background': s.accent} : {}"
            [ngClass]="d <= s.level ? '' : 'bg-slate-200 dark:bg-white/10'">
      </span>
    </div>

  </div>
</div>

<!-- ── Currently Learning ── -->
<div class="mt-9 px-6 py-4 rounded-[18px]
            flex flex-wrap items-center gap-4
            transition-colors duration-500
            bg-gray-50
            border border-slate-200
            shadow-sm shadow-slate-100 dark:text-gray-400
            dark:bg-gray-900 dark:border-gray-900 dark:shadow-none">

  <div class="flex items-center gap-2 whitespace-nowrap">
    <span class="w-1.5 h-1.5 rounded-full bg-violet-400 animate-pulse"></span>
    <span class="text-[11px] font-semibold uppercase tracking-widest
                 text-slate-400 dark:text-white/28
                 transition-colors duration-500">
      Currently Learning
    </span>
  </div>

  <div class="flex flex-wrap gap-2">
    <span *ngFor="let l of learning"
          class="px-3.5 py-1 rounded-full text-[12px] font-medium
                 cursor-default transition-all duration-250
                 bg-gray-50 border border-slate-200 text-slate-500
                 shadow-sm shadow-slate-100
                 hover:text-violet-600 hover:border-violet-300
                 hover:bg-violet-50 hover:shadow-violet-100
                 dark:text-gray-400
            dark:bg-gray-900 dark:border-gray-900
                 dark:hover:text-violet-400 dark:hover:border-violet-500/40
                 dark:hover:bg-violet-500/7">
      {{ l }}
    </span>
  </div>
</div>

  </div>
</section>
